<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="55%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea44f"/>
      <stop offset="50%" stop-color="#58f7a1"/>
      <stop offset="100%" stop-color="#2ea44f"/>
    </linearGradient>
    <linearGradient id="cve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2433" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- scanlines -->
  <g opacity="0.12">
    <line x1="0" y1="20" x2="1200" y2="20" stroke="#58f7a1" stroke-width="1">
      <animate attributeName="y1" values="-20;340" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-20;340" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- radar sweep -->
  <g transform="translate(1040,160)" opacity="0.55">
    <circle r="96" fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.4"/>
    <circle r="62" fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.35"/>
    <circle r="28" fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.3"/>
    <g stroke="#58f7a1" stroke-width="2" opacity="0.7">
      <line x1="0" y1="0" x2="96" y2="0">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </line>
    </g>
    <circle r="3" fill="#58f7a1">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <text x="60" y="118" font-size="24" fill="#58f7a1" letter-spacing="6" font-weight="600">
    VULNERABILITY RESEARCH
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text x="56" y="192" font-size="62" font-weight="800" fill="#e6edf3" letter-spacing="1">
    BUG BOUNTIES
  </text>
  <rect x="60" y="212" width="0" height="4" fill="url(#accent)">
    <animate attributeName="width" values="0;520" dur="2.2s" fill="freeze"/>
  </rect>

  <text x="60" y="262" font-size="20" fill="#8b949e">
    Bugcrowd · HackerOne · VDP Direct · CVE Research
  </text>

  <!-- badges -->
  <g font-size="16" font-weight="700">
    <rect x="60" y="278" rx="12" width="150" height="30" fill="none" stroke="#2ea44f" stroke-width="1.5"/>
    <text x="76" y="299" fill="#58f7a1">$1,425 USD</text>

    <rect x="224" y="278" rx="12" width="170" height="30" fill="none" stroke="url(#cve)" stroke-width="1.5"/>
    <text x="240" y="299" fill="#79c0ff">3× CVE 2026</text>

    <rect x="408" y="278" rx="12" width="200" height="30" fill="none" stroke="#d29922" stroke-width="1.5"/>
    <text x="424" y="299" fill="#e3b341">Hall of Fame ×7</text>
  </g>
</svg>
